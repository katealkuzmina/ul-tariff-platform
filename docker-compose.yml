services:
  db:
    image: postgres:17
    container_name: ul-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      N_PRICES: ${N_PRICES:-300000}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/source:/opt/sql:ro
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-deals_bigdata}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: ul-tariff-app
    container_name: ul-app
    env_file:
      - .env
    environment:
      DB_HOST: db
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/deals_bigdata
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  airflow-init:
    profiles: ["bonus"]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: ul-tariff-airflow
    container_name: ul-airflow-init
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/deals_bigdata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://postgres:postgres@db:5432/deals_bigdata
      AIRFLOW__API_AUTH__JWT_SECRET: ul-tariff-dev-jwt-secret
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true"

  airflow-scheduler:
    profiles: ["bonus"]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: ul-tariff-airflow
    container_name: ul-airflow-scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/deals_bigdata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://postgres:postgres@db:5432/deals_bigdata
      AIRFLOW__API_AUTH__JWT_SECRET: ul-tariff-dev-jwt-secret
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command:
      - airflow
      - scheduler

  airflow-dag-processor:
    profiles: ["bonus"]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: ul-tariff-airflow
    container_name: ul-airflow-dag-processor
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/deals_bigdata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://postgres:postgres@db:5432/deals_bigdata
      AIRFLOW__API_AUTH__JWT_SECRET: ul-tariff-dev-jwt-secret
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command:
      - airflow
      - dag-processor

  airflow-webserver:
    profiles: ["bonus"]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: ul-tariff-airflow
    container_name: ul-airflow-webserver
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/deals_bigdata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://postgres:postgres@db:5432/deals_bigdata
      AIRFLOW__API_AUTH__JWT_SECRET: ul-tariff-dev-jwt-secret
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command:
      - airflow
      - api-server
      - --host
      - "0.0.0.0"
      - --port
      - "8080"

  clickhouse:
    profiles: ["bonus"]
    image: clickhouse/clickhouse-server:24.8
    container_name: ul-clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  superset:
    profiles: ["bonus"]
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    image: ul-tariff-superset
    container_name: ul-superset
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-ul-tariff-dev-secret-key}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:postgres@db:5432/superset
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker/superset/init.sh:/app/init.sh:ro
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: bash /app/init.sh

volumes:
  pgdata:
  chdata:
